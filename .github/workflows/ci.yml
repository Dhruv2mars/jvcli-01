name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: chmod +x dist/cli-entry.js
      - run: bun run typecheck
      - run: bun run test
      - run: scripts/ga-walkthrough.sh dist/cli-entry.js
      - run: sh scripts/pack-smoke.sh
      - run: bun benchmarks/run.ts --layers 5 --files 5
